<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
>

  <defs>

    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#17112f"
      />

      <stop
        offset="100%"
        stop-color="#080b10"
      />
    </linearGradient>

    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#a18aff"
      />

      <stop
        offset="100%"
        stop-color="#6b4cff"
      />
    </linearGradient>

  </defs>


  <!-- APP BACKGROUND -->

  <rect
    width="512"
    height="512"
    rx="112"
    fill="url(#bg)"
  />


  <!-- MAIN CARD -->

  <rect
    x="86"
    y="86"
    width="340"
    height="340"
    rx="52"
    fill="#10161e"
    stroke="#2c3440"
    stroke-width="8"
  />


  <!-- WEBSITE WINDOW -->

  <rect
    x="130"
    y="135"
    width="252"
    height="195"
    rx="22"
    fill="#080b10"
  />


  <!-- WINDOW HEADER -->

  <rect
    x="130"
    y="135"
    width="252"
    height="42"
    rx="22"
    fill="#171f29"
  />


  <!-- WINDOW DOTS -->

  <circle
    cx="157"
    cy="156"
    r="7"
    fill="#6b7280"
  />

  <circle
    cx="180"
    cy="156"
    r="7"
    fill="#6b7280"
  />

  <circle
    cx="203"
    cy="156"
    r="7"
    fill="#6b7280"
  />


  <!-- WEBSITE CONTENT -->

  <rect
    x="155"
    y="202"
    width="115"
    height="14"
    rx="7"
    fill="url(#accent)"
  />

  <rect
    x="155"
    y="231"
    width="180"
    height="9"
    rx="4"
    fill="#374151"
  />

  <rect
    x="155"
    y="252"
    width="145"
    height="9"
    rx="4"
    fill="#374151"
  />


  <!-- CTA BUTTON -->

  <rect
    x="155"
    y="278"
    width="82"
    height="27"
    rx="9"
    fill="url(#accent)"
  />


  <!-- FORM SYMBOL -->

  <rect
    x="173"
    y="350"
    width="166"
    height="42"
    rx="14"
    fill="url(#accent)"
  />

  <text
    x="256"
    y="378"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="800"
